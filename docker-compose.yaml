version: "3.9"

services:
  # --------------------------------------------------
  # MINIO (Object Storage)
  # --------------------------------------------------
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: P@ssw0rd
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  # --------------------------------------------------
  # POSTGRES + POSTGIS
  # --------------------------------------------------
  postgres:
    image: postgis/postgis:15-3.4
    container_name: postgres
    environment:
      POSTGRES_DB: ifcdb
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: P@ssw0rd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # --------------------------------------------------
  # PGADMIN
  # --------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sirius.com
      PGADMIN_DEFAULT_PASSWORD: P@ssw0rd
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: always

  # --------------------------------------------------
  # REDIS (MESSAGE BROKER)
  # --------------------------------------------------
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  # --------------------------------------------------
  # ZOOKEEPER
  # --------------------------------------------------
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    restart: always

  # --------------------------------------------------
  # KAFKA
  # --------------------------------------------------
  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: always

  # --------------------------------------------------
  # FLASK SOCKET.IO SERVICE (PAKAI REDIS SEBAGAI MESSAGE QUEUE)
  # --------------------------------------------------
  flask-socketio:
    build: ./flask-socketio
    container_name: flask-socketio
    depends_on:
      - redis
      - kafka
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      KAFKA_BROKER: kafka:9092
    restart: always

  # --------------------------------------------------
  # FLASK IFC EXTRACTOR BACKEND (PAKAI KAFKA)
  # --------------------------------------------------
  flask-ifcextractor-backend:
    build: ./flask-ifcextractor-backend
    container_name: flask-ifcextractor-backend
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092
    ports:
      - "5100:5000"
    restart: always

  # --------------------------------------------------
  # FLASK IFC OPEN SHELL WORKER (PAKAI REDIS + KAFKA)
  # --------------------------------------------------
  flask-ifcopenshell-worker:
    build: ./flask-ifcopenshell-worker
    container_name: flask-ifcopenshell-worker
    depends_on:
      - kafka
      - redis
    environment:
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis
    restart: always

  # --------------------------------------------------
  # NODE WORKER (TOE ENGINE) – SUBSCRIBE KAFKA + REDIS
  # --------------------------------------------------
  node-toe-worker:
    build: ./node-toe-worker
    container_name: node-toe-worker
    depends_on:
      - kafka
      - redis
    environment:
      KAFKA_BROKER: kafka:9092
      REDIS_HOST: redis
    restart: always

volumes:
  minio_data:
  postgres_data:
  pgadmin_data:
